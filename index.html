<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ライプニッツ・グレゴリーπ級数収束プロッター</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-950 text-emerald-100 min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-6">
  <header class="text-center mb-6">
    <h1 class="text-2xl font-bold text-emerald-200 mb-1">π級数収束プロッター</h1>
    <p class="text-emerald-500 text-xs">ライプニッツ公式とマチン公式の収束速度を比較</p>
  </header>

  <canvas id="canvas" width="740" height="400" class="w-full rounded-xl border border-emerald-800 bg-emerald-950 block mb-4" aria-label="π収束グラフ"></canvas>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
    <div class="bg-emerald-900 rounded-xl p-4">
      <label for="maxTerms" class="block text-sm text-emerald-300 mb-2">最大項数: <span id="valTerms" class="text-white font-bold">1000</span></label>
      <input id="maxTerms" type="range" min="10" max="5000" step="10" value="1000" class="w-full accent-emerald-400" aria-label="最大項数" oninput="onParamChange()">
    </div>
    <div class="bg-emerald-900 rounded-xl p-4">
      <label class="block text-sm text-emerald-300 mb-2">表示系列</label>
      <div class="space-y-1">
        <label class="flex items-center gap-2 text-xs cursor-pointer">
          <input type="checkbox" id="showLeibniz" checked class="w-3 h-3" aria-label="ライプニッツ公式を表示" onchange="plot()">
          <span class="text-orange-300">● ライプニッツ（遅い）</span>
        </label>
        <label class="flex items-center gap-2 text-xs cursor-pointer">
          <input type="checkbox" id="showMachin" checked class="w-3 h-3" aria-label="マチン公式を表示" onchange="plot()">
          <span class="text-cyan-300">● マチン（速い）</span>
        </label>
        <label class="flex items-center gap-2 text-xs cursor-pointer">
          <input type="checkbox" id="showPiLine" checked class="w-3 h-3" aria-label="π真値を表示" onchange="plot()">
          <span class="text-green-300">── π 真値</span>
        </label>
      </div>
    </div>
    <div class="bg-emerald-900 rounded-xl p-4">
      <label class="block text-sm text-emerald-300 mb-2">表示モード</label>
      <select id="displayMode" class="w-full bg-emerald-800 border border-emerald-600 text-emerald-100 rounded-lg px-2 py-1 text-sm mb-2" aria-label="表示モード" onchange="plot()">
        <option value="pi">π 近似値</option>
        <option value="error">誤差（絶対値）</option>
        <option value="digits">有効桁数</option>
      </select>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4 mb-4">
    <div class="bg-emerald-900 border border-emerald-700 rounded-xl p-4">
      <div class="text-xs text-emerald-500 mb-2">ライプニッツ（N項時点）</div>
      <div class="text-2xl font-mono font-bold text-orange-300 mb-1" id="leibnizVal">-</div>
      <div class="text-xs text-emerald-400" id="leibnizDigits">-</div>
    </div>
    <div class="bg-emerald-900 border border-emerald-700 rounded-xl p-4">
      <div class="text-xs text-emerald-500 mb-2">マチン（N項時点）</div>
      <div class="text-2xl font-mono font-bold text-cyan-300 mb-1" id="machinVal">-</div>
      <div class="text-xs text-emerald-400" id="machinDigits">-</div>
    </div>
  </div>

  <div class="bg-emerald-900 border border-emerald-800 rounded-xl p-4 mb-4 text-xs text-emerald-400">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <div class="font-bold text-emerald-200 mb-1">ライプニッツ・グレゴリー公式</div>
        <div class="font-mono text-orange-300">π/4 = 1 - 1/3 + 1/5 - 1/7 + ...</div>
        <div class="mt-1 text-emerald-500">1671年グレゴリー・1674年ライプニッツ発見。収束が非常に遅く、小数点以下2桁を得るのに数百項必要。</div>
      </div>
      <div>
        <div class="font-bold text-emerald-200 mb-1">マチン公式</div>
        <div class="font-mono text-cyan-300">π/4 = 4·arctan(1/5) - arctan(1/239)</div>
        <div class="mt-1 text-emerald-500">1706年マチン発見。arctan(x)のテイラー展開を利用。x=1/5は収束が速く少ない項数で高精度を達成。</div>
      </div>
    </div>
  </div>

  <div class="bg-emerald-900 border border-emerald-800 rounded-xl p-4 text-xs">
    <div class="font-bold text-emerald-200 mb-2">現在の近似値（選択した項数）</div>
    <div id="detailedOutput" class="font-mono text-emerald-300 text-xs leading-relaxed whitespace-pre-wrap"></div>
  </div>
</div>

<script>
const PI = Math.PI;

// Leibniz-Gregory: pi/4 = sum_{k=0}^{N} (-1)^k / (2k+1)
function leibniz(n) {
  let sum = 0;
  for (let k = 0; k < n; k++) {
    sum += (k % 2 === 0 ? 1 : -1) / (2 * k + 1);
  }
  return 4 * sum;
}

// Machin's formula: pi/4 = 4*arctan(1/5) - arctan(1/239)
// arctan(x) = x - x^3/3 + x^5/5 - ...
function atanSeries(x, n) {
  let sum = 0;
  let xPow = x;
  for (let k = 0; k < n; k++) {
    sum += (k % 2 === 0 ? 1 : -1) * xPow / (2 * k + 1);
    xPow *= x * x;
  }
  return sum;
}

function machin(n) {
  // Need more terms for 1/239 since it converges much faster
  const n2 = Math.max(1, Math.floor(n / 10));
  return 4 * (4 * atanSeries(1/5, n) - atanSeries(1/239, n2));
}

function countDigits(approx) {
  const err = Math.abs(approx - PI);
  if (err === 0) return 15;
  return Math.max(0, -Math.log10(err));
}

function formatPi(val) {
  return val.toFixed(10);
}

function onParamChange() {
  document.getElementById('valTerms').textContent = parseInt(document.getElementById('maxTerms').value).toLocaleString();
  plot();
}

function plot() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const maxN = parseInt(document.getElementById('maxTerms').value);
  const mode = document.getElementById('displayMode').value;
  const showL = document.getElementById('showLeibniz').checked;
  const showM = document.getElementById('showMachin').checked;
  const showPI = document.getElementById('showPiLine').checked;

  ctx.fillStyle = '#022c22';
  ctx.fillRect(0, 0, W, H);

  // Compute series values at sample points
  const numSamples = Math.min(maxN, 500);
  const step = maxN / numSamples;
  const leibPoints = [];
  const machinPoints = [];

  for (let i = 0; i < numSamples; i++) {
    const n = Math.max(1, Math.round((i + 1) * step));
    if (showL) {
      const lv = leibniz(n);
      let yv;
      if (mode === 'pi') yv = lv;
      else if (mode === 'error') yv = Math.abs(lv - PI);
      else yv = countDigits(lv);
      leibPoints.push({ n, v: yv });
    }
    if (showM) {
      const mv = machin(n);
      let yv;
      if (mode === 'pi') yv = mv;
      else if (mode === 'error') yv = Math.abs(mv - PI);
      else yv = countDigits(mv);
      machinPoints.push({ n, v: yv });
    }
  }

  // Find value range
  let minV = Infinity, maxV = -Infinity;
  if (mode === 'pi') {
    minV = PI - 0.5;
    maxV = PI + 0.5;
    // Adjust for first few points
    if (leibPoints.length > 0) {
      const startV = leibPoints[0].v;
      minV = Math.min(minV, startV - 0.1);
      maxV = Math.max(maxV, startV + 0.1);
    }
  } else if (mode === 'error') {
    minV = 0;
    // Log scale for error
    [...leibPoints, ...machinPoints].forEach(p => {
      if (p.v > 0) maxV = Math.max(maxV, p.v);
    });
    maxV = maxV || 1;
  } else {
    minV = 0;
    maxV = 15;
  }

  const pad = { left: 60, right: 20, top: 20, bottom: 40 };
  const plotW = W - pad.left - pad.right;
  const plotH = H - pad.top - pad.bottom;

  function toX(n) { return pad.left + (n / maxN) * plotW; }
  function toY(v) {
    if (mode === 'error') {
      // Log scale
      if (v <= 0) return pad.top + plotH;
      const logV = Math.log10(v);
      const logMin = Math.log10(1e-15);
      const logMax = Math.log10(maxV);
      return pad.top + plotH - ((logV - logMin) / (logMax - logMin)) * plotH;
    }
    return pad.top + plotH - ((v - minV) / (maxV - minV)) * plotH;
  }

  // Grid
  ctx.strokeStyle = '#064e3b';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    const x = pad.left + (i / 10) * plotW;
    ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, pad.top + plotH); ctx.stroke();
  }
  for (let i = 0; i <= 5; i++) {
    const y = pad.top + (i / 5) * plotH;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + plotW, y); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = '#059669';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pad.left, pad.top); ctx.lineTo(pad.left, pad.top + plotH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad.left, pad.top + plotH); ctx.lineTo(pad.left + plotW, pad.top + plotH); ctx.stroke();

  // PI reference line
  if (showPI && mode === 'pi') {
    const piY = toY(PI);
    ctx.strokeStyle = 'rgba(74,222,128,0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 3]);
    ctx.beginPath(); ctx.moveTo(pad.left, piY); ctx.lineTo(pad.left + plotW, piY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#4ade80';
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('π = ' + PI.toFixed(6), pad.left + 2, piY - 3);
  }

  // Draw Leibniz
  if (showL && leibPoints.length > 1) {
    ctx.strokeStyle = '#f97316';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    leibPoints.forEach((p, i) => {
      const x = toX(p.n);
      const y = toY(p.v);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  // Draw Machin
  if (showM && machinPoints.length > 1) {
    ctx.strokeStyle = '#22d3ee';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    machinPoints.forEach((p, i) => {
      const x = toX(p.n);
      const y = toY(p.v);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  // Axis labels
  ctx.fillStyle = '#6ee7b7';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('項数 N (0 → ' + maxN.toLocaleString() + ')', pad.left + plotW/2, H - 5);
  ctx.save();
  ctx.translate(12, pad.top + plotH/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText(mode === 'pi' ? 'π近似値' : mode === 'error' ? '誤差 (log)' : '有効桁数', 0, 0);
  ctx.restore();

  // Legend
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'left';
  if (showL) { ctx.fillStyle = '#f97316'; ctx.fillText('── ライプニッツ', pad.left + 5, pad.top + 15); }
  if (showM) { ctx.fillStyle = '#22d3ee'; ctx.fillText('── マチン', pad.left + 5, pad.top + 28); }

  // Current values
  const nFinal = maxN;
  const lFinal = leibniz(nFinal);
  const mFinal = machin(nFinal);

  document.getElementById('leibnizVal').textContent = formatPi(lFinal);
  document.getElementById('leibnizDigits').textContent = '有効桁数: ' + countDigits(lFinal).toFixed(1) + '桁';
  document.getElementById('machinVal').textContent = formatPi(mFinal);
  document.getElementById('machinDigits').textContent = '有効桁数: ' + countDigits(mFinal).toFixed(1) + '桁';

  // Detailed comparison
  const detail = [
    'π（真値）   = ' + PI.toFixed(15),
    'ライプニッツ = ' + lFinal.toFixed(15) + '  (' + nFinal.toLocaleString() + '項)',
    'マチン      = ' + mFinal.toFixed(15) + '  (' + nFinal.toLocaleString() + '項)',
    '',
    'ライプニッツ誤差: ' + Math.abs(lFinal - PI).toExponential(4),
    'マチン誤差:      ' + Math.abs(mFinal - PI).toExponential(4),
    'マチンはライプニッツの ' + (Math.abs(lFinal - PI) / (Math.abs(mFinal - PI) + 1e-20)).toFixed(0) + '倍速く収束',
  ].join('\n');
  document.getElementById('detailedOutput').textContent = detail;
}

window.onload = () => { onParamChange(); };
</script>
</body>
</html>
